[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-osi"
version = "0.1.0"
description = "Odoo Open Source Intelligence platform with an MCP interface for discovering and analyzing open-source Odoo modules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Odoo OSI Contributors" }
]
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]
mcp = [
  "mcp>=1.2.0"
]

[project.scripts]
odoo-osi = "odoo_osi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_osi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

